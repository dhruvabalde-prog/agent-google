<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="needleNorth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="needleSouth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)"/>
  <!-- Outer Compass Ring -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="#334155" stroke-width="1.5"/>
  <!-- Cardinal points ticks -->
  <line x1="16" y1="4.5" x2="16" y2="6.5" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="25.5" x2="16" y2="27.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="4.5" y1="16" x2="6.5" y2="16" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="25.5" y1="16" x2="27.5" y2="16" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- North Needle (Electric Indigo/Blue) -->
  <polygon points="16,6.5 19,16 16,14.5" fill="url(#needleNorth)"/>
  <polygon points="16,6.5 13,16 16,14.5" fill="#38bdf8"/>
  <!-- South Needle (Slate Silver) -->
  <polygon points="16,25.5 19,16 16,17.5" fill="url(#needleSouth)"/>
  <polygon points="16,25.5 13,16 16,17.5" fill="#cbd5e1"/>
  <!-- Center Pivot Pin -->
  <circle cx="16" cy="16" r="2.2" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
</svg>
