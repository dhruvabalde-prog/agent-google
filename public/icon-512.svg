<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="needleNorth512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="needleSouth512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bgGrad512)"/>
  <!-- Outer Compass Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#334155" stroke-width="10"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="8 16"/>
  <!-- Cardinal points ticks -->
  <line x1="256" y1="75" x2="256" y2="105" stroke="#60a5fa" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="407" x2="256" y2="437" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <line x1="75" y1="256" x2="105" y2="256" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <line x1="407" y1="256" x2="437" y2="256" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <!-- Compass Needle North -->
  <polygon points="256,105 304,256 256,232" fill="url(#needleNorth512)"/>
  <polygon points="256,105 208,256 256,232" fill="#38bdf8"/>
  <!-- Compass Needle South -->
  <polygon points="256,407 304,256 256,280" fill="url(#needleSouth512)"/>
  <polygon points="256,407 208,256 256,280" fill="#cbd5e1"/>
  <!-- Center Pivot Pin -->
  <circle cx="256" cy="256" r="36" fill="#ffffff" stroke="#0f172a" stroke-width="10"/>
  <circle cx="256" cy="256" r="16" fill="#2563eb"/>
</svg>
